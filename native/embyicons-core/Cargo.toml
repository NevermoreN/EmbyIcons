[package]
name = "embyicons-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
skia-safe = { version = "=0.157.0", default-features = false, features = ["binary-cache", "jpeg", "pdf"] }
ureq = { version = "3", features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
